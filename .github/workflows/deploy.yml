name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Generate artist pages and sitemap
        env:
          POKECHECKLIST_SITE_URL: https://pokechecklist.com
          POKECHECKLIST_GA_MEASUREMENT_ID: ${{ vars.POKECHECKLIST_GA_MEASUREMENT_ID }}
        run: node scripts/build-site.mjs
      - name: Upload site files
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
